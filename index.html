<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全能單字複習器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f3ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    .flip-card-inner {
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }
    @keyframes pulse-subtle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.98); }
    }
    .pulse-feedback {
      animation: pulse-subtle 0.25s ease-in-out;
    }
  </style>
</head>
<body class="h-full flex flex-col text-slate-800 antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header Bar -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-xs">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
          <i class="fa-solid fa-graduation-cap text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 leading-tight">全能單字複習器</h1>
          <p class="text-xs text-slate-500">雜誌 • 單字書 • 課本 智慧複習</p>
        </div>
      </div>

      <!-- Mode Switcher Tabs (Desktop) -->
      <nav class="hidden md:flex items-center space-x-1 bg-slate-100 p-1 rounded-xl text-sm font-medium">
        <button onclick="switchTab('cards')" id="tab-cards" class="tab-btn px-3.5 py-1.5 rounded-lg transition-all duration-200 bg-white text-brand-600 shadow-xs">
          <i class="fa-solid fa-clone mr-1.5"></i>單字卡
        </button>
        <button onclick="switchTab('quiz')" id="tab-quiz" class="tab-btn px-3.5 py-1.5 rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900">
          <i class="fa-solid fa-circle-question mr-1.5"></i>選擇題
        </button>
        <button onclick="switchTab('spelling')" id="tab-spelling" class="tab-btn px-3.5 py-1.5 rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900">
          <i class="fa-solid fa-keyboard mr-1.5"></i>拼字測驗
        </button>
        <button onclick="switchTab('browser')" id="tab-browser" class="tab-btn px-3.5 py-1.5 rounded-lg transition-all duration-200 text-slate-600 hover:text-slate-900">
          <i class="fa-solid fa-list-check mr-1.5"></i>單字庫
        </button>
      </nav>

      <!-- Stats Summary Badge -->
      <div class="flex items-center space-x-2">
        <div class="bg-amber-50 text-amber-700 px-3 py-1 rounded-full text-xs font-semibold border border-amber-200/60 flex items-center">
          <i class="fa-solid fa-star text-amber-400 mr-1.5"></i>
          <span id="starredCount">0</span> 標記
        </div>
      </div>
    </div>

    <!-- Mobile Nav Bar -->
    <div class="flex md:hidden border-t border-slate-100 bg-slate-50 px-2 py-1.5 justify-around text-xs font-medium">
      <button onclick="switchTab('cards')" id="mob-tab-cards" class="mob-tab-btn flex flex-col items-center p-1 text-brand-600 font-bold">
        <i class="fa-solid fa-clone text-base mb-0.5"></i>單字卡
      </button>
      <button onclick="switchTab('quiz')" id="mob-tab-quiz" class="mob-tab-btn flex flex-col items-center p-1 text-slate-500">
        <i class="fa-solid fa-circle-question text-base mb-0.5"></i>選擇題
      </button>
      <button onclick="switchTab('spelling')" id="mob-tab-spelling" class="mob-tab-btn flex flex-col items-center p-1 text-slate-500">
        <i class="fa-solid fa-keyboard text-base mb-0.5"></i>拼字
      </button>
      <button onclick="switchTab('browser')" id="mob-tab-browser" class="mob-tab-btn flex flex-col items-center p-1 text-slate-500">
        <i class="fa-solid fa-list-check text-base mb-0.5"></i>總覽
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 flex flex-col space-y-6">

    <!-- Global Filters Bar -->
    <section class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 flex flex-wrap gap-3 items-center justify-between">
      <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto flex-1">
        <!-- Category Filter -->
        <div class="flex-1 sm:flex-initial min-w-[130px]">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">來源分類</label>
          <select id="filterCategory" onchange="onCategoryChange()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
            <option value="ALL">🌟 全部分類</option>
            <option value="單字書">📚 單字書</option>
            <option value="雜誌">📰 雜誌</option>
            <option value="課本">📖 課本</option>
          </select>
        </div>

        <!-- Unit Filter -->
        <div class="flex-1 sm:flex-initial min-w-[130px]">
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">課別/單元</label>
          <select id="filterUnit" onchange="onFilterChange()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none transition">
            <option value="ALL">全部單元</option>
          </select>
        </div>

        <!-- Starred Only Toggle -->
        <div class="flex items-end pb-0.5">
          <label class="cursor-pointer inline-flex items-center bg-slate-50 hover:bg-slate-100 border border-slate-200 px-3 py-2 rounded-xl transition text-sm text-slate-700 font-medium select-none">
            <input type="checkbox" id="filterStarred" onchange="onFilterChange()" class="rounded border-slate-300 text-brand-600 focus:ring-brand-500 mr-2 h-4 w-4">
            <i class="fa-solid fa-star text-amber-400 mr-1.5"></i>僅標記重點
          </label>
        </div>
      </div>

      <!-- Word Count Badge & Shuffle -->
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-between border-t sm:border-t-0 pt-2 sm:pt-0 border-slate-100">
        <div class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg">
          範圍內共 <span id="filteredWordCount" class="text-brand-600 font-bold">0</span> 字
        </div>
        <button onclick="shuffleAndReset()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-3 py-2 rounded-xl transition flex items-center active:scale-95">
          <i class="fa-solid fa-shuffle mr-1.5 text-slate-500"></i>隨機打亂
        </button>
      </div>
    </section>

    <!-- TAB 1: FLASHCARDS -->
    <section id="view-cards" class="view-panel flex-1 flex flex-col items-center justify-center min-h-[420px]">
      <div class="w-full max-w-xl flex flex-col items-center space-y-6">
        
        <!-- Progress Bar -->
        <div class="w-full flex items-center justify-between text-xs font-semibold text-slate-400 px-1">
          <span id="cardProgressText">第 1 / 10 字</span>
          <div class="w-2/3 bg-slate-200 h-2 rounded-full overflow-hidden">
            <div id="cardProgressBar" class="bg-brand-600 h-full w-0 transition-all duration-300"></div>
          </div>
        </div>

        <!-- 3D Flip Card -->
        <div onclick="flipCard()" class="perspective-1000 w-full h-80 cursor-pointer group">
          <div id="flashcardInner" class="flip-card-inner relative w-full h-full transform-style-3d shadow-xl rounded-3xl border border-slate-200/80 bg-white">
            
            <!-- Card Front (English) -->
            <div class="absolute inset-0 w-full h-full backface-hidden rounded-3xl p-8 flex flex-col justify-between items-center text-center bg-gradient-to-b from-white to-slate-50/50">
              <div class="w-full flex justify-between items-center text-xs font-semibold text-slate-400">
                <span id="cardCategoryTag" class="bg-brand-50 text-brand-600 border border-brand-100 px-2.5 py-1 rounded-full font-bold">單字書 • U17</span>
                <button onclick="event.stopPropagation(); toggleStarCurrent()" id="cardStarBtn" class="p-2 text-slate-300 hover:text-amber-400 transition text-lg">
                  <i class="fa-solid fa-star"></i>
                </button>
              </div>

              <div class="my-auto py-4">
                <h2 id="cardWord" class="text-4xl sm:text-5xl font-black text-slate-800 tracking-tight mb-2">annual</h2>
                <p class="text-xs text-slate-400 font-medium"><i class="fa-solid fa-hand-pointer mr-1"></i>點擊卡片翻面看中文釋義</p>
              </div>

              <div class="w-full flex justify-between items-center pt-2">
                <button onclick="event.stopPropagation(); speakCardWord()" title="播放發音" class="w-10 h-10 rounded-full bg-slate-100 hover:bg-brand-100 text-slate-600 hover:text-brand-600 transition flex items-center justify-center">
                  <i class="fa-solid fa-volume-high"></i>
                </button>
                <span class="text-xs font-semibold text-slate-400 flex items-center">
                  <i class="fa-solid fa-rotate mr-1 text-slate-300"></i>翻轉卡片
                </span>
              </div>
            </div>

            <!-- Card Back (Chinese) -->
            <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-3xl p-8 flex flex-col justify-between items-center text-center bg-gradient-to-b from-indigo-900 to-slate-900 text-white">
              <div class="w-full flex justify-between items-center text-xs font-medium text-slate-300">
                <span id="cardCategoryTagBack" class="bg-white/10 px-2.5 py-1 rounded-full">單字書 • U17</span>
                <span class="text-amber-300 font-bold"><i class="fa-solid fa-lightbulb mr-1"></i>中文解釋</span>
              </div>

              <div class="my-auto py-4">
                <h3 id="cardTranslation" class="text-3xl sm:text-4xl font-bold tracking-wide text-amber-300 mb-2">一年一度的</h3>
                <p id="cardWordSub" class="text-slate-300 font-mono text-sm opacity-80">annual</p>
              </div>

              <div class="w-full flex justify-center items-center pt-2">
                <button onclick="event.stopPropagation(); speakCardWord()" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold transition flex items-center">
                  <i class="fa-solid fa-volume-high mr-2 text-indigo-300"></i>播放美音發音
                </button>
              </div>
            </div>

          </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex items-center justify-between w-full max-w-md px-2">
          <button onclick="prevCard()" class="px-5 py-3 rounded-2xl bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 font-bold shadow-xs transition active:scale-95 flex items-center">
            <i class="fa-solid fa-arrow-left mr-2"></i>上一字
          </button>
          
          <button onclick="speakCardWord()" title="播放發音" class="w-12 h-12 rounded-2xl bg-brand-50 hover:bg-brand-100 border border-brand-200 text-brand-600 transition flex items-center justify-center text-lg shadow-xs">
            <i class="fa-solid fa-volume-high"></i>
          </button>

          <button onclick="nextCard()" class="px-5 py-3 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white font-bold shadow-md shadow-brand-500/20 transition active:scale-95 flex items-center">
            下一字<i class="fa-solid fa-arrow-right ml-2"></i>
          </button>
        </div>

      </div>
    </section>

    <!-- TAB 2: MULTIPLE CHOICE QUIZ -->
    <section id="view-quiz" class="view-panel hidden flex-1 flex flex-col items-center justify-center min-h-[420px]">
      <div class="w-full max-w-xl bg-white rounded-3xl p-6 sm:p-8 shadow-xs border border-slate-200/80 flex flex-col space-y-6">
        
        <!-- Start Quiz Cover Screen -->
        <div id="quizStartCard" class="text-center py-10 px-4 space-y-5">
          <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-xs">
            <i class="fa-solid fa-circle-question"></i>
          </div>
          <div>
            <h3 class="text-2xl font-black text-slate-800">選擇題測驗</h3>
            <p class="text-sm text-slate-500 mt-1">目前範圍共 <span id="quizStartCount" class="font-bold text-brand-600">0</span> 個單字，準備好即可開始！</p>
          </div>
          <button onclick="startQuiz()" class="px-8 py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl shadow-lg shadow-brand-500/30 transition active:scale-95 text-base inline-flex items-center">
            <i class="fa-solid fa-play mr-2"></i>開始測驗
          </button>
        </div>

        <!-- Quiz Active Question View Container -->
        <div id="quizMainContent" class="hidden flex-col space-y-6">
          <!-- Score & Stats Bar -->
          <div class="flex items-center justify-between border-b border-slate-100 pb-4">
            <div class="flex items-center space-x-3">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400">連勝紀錄</span>
              <span id="quizStreak" class="bg-amber-100 text-amber-700 px-2.5 py-0.5 rounded-full font-black text-xs">🔥 0</span>
            </div>
            <div class="flex items-center space-x-4 text-xs font-bold text-slate-600">
              <span>答對: <span id="quizCorrect" class="text-emerald-600 font-black">0</span></span>
              <span>總題數: <span id="quizTotal" class="text-slate-800 font-black">0</span></span>
            </div>
          </div>

          <!-- Question Prompt Card -->
          <div class="text-center py-6 bg-slate-50 rounded-2xl border border-slate-100 relative">
            <span id="quizTag" class="absolute top-3 left-3 text-[10px] font-bold uppercase bg-slate-200 text-slate-600 px-2 py-0.5 rounded-md">單字書</span>
            <button onclick="speakQuizWord()" title="播放發音" class="absolute top-3 right-3 p-2 text-slate-400 hover:text-brand-600 transition">
              <i class="fa-solid fa-volume-high text-lg"></i>
            </button>
            <h2 id="quizQuestionWord" class="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight my-2">annual</h2>
            <p class="text-xs text-slate-400">請選擇正確的中文解釋</p>
          </div>

          <!-- Choices Grid -->
          <div id="quizChoices" class="grid grid-cols-1 gap-3">
            <!-- Choices populated dynamically -->
          </div>

          <!-- Next Quiz Question Button -->
          <button id="quizNextBtn" onclick="generateQuizQuestion()" class="hidden w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold shadow-md transition flex items-center justify-center">
            下一題 <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
          </button>
        </div>

      </div>
    </section>

    <!-- TAB 3: SPELLING PRACTICE -->
    <section id="view-spelling" class="view-panel hidden flex-1 flex flex-col items-center justify-center min-h-[420px]">
      <div class="w-full max-w-xl bg-white rounded-3xl p-6 sm:p-8 shadow-xs border border-slate-200/80 flex flex-col space-y-6">
        
        <!-- Start Spelling Screen -->
        <div id="spellingStartCard" class="text-center py-10 px-4 space-y-5">
          <div class="w-16 h-16 bg-indigo-50 text-brand-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-xs">
            <i class="fa-solid fa-keyboard"></i>
          </div>
          <div>
            <h3 class="text-2xl font-black text-slate-800">拼字挑戰</h3>
            <p class="text-sm text-slate-500 mt-1">目前範圍共 <span id="spellingStartCount" class="font-bold text-brand-600">0</span> 個單字，準備好即可開始！</p>
          </div>
          <button onclick="startSpelling()" class="px-8 py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-2xl shadow-lg shadow-brand-500/30 transition active:scale-95 text-base inline-flex items-center">
            <i class="fa-solid fa-play mr-2"></i>開始測驗
          </button>
        </div>

        <!-- Spelling Main Content Container -->
        <div id="spellingMainContent" class="hidden flex-col space-y-6">
          <div class="flex items-center justify-between border-b border-slate-100 pb-4">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">拼字挑戰</span>
            <span id="spellingScore" class="bg-indigo-50 text-brand-600 px-3 py-1 rounded-full font-bold text-xs">得分: 0</span>
          </div>

          <!-- Chinese Prompt & Audio -->
          <div class="text-center py-6 bg-indigo-50/50 rounded-2xl border border-indigo-100/60 flex flex-col items-center">
            <span id="spellingTag" class="text-[10px] font-bold uppercase bg-indigo-100 text-brand-700 px-2 py-0.5 rounded-md mb-2">課本 • L4</span>
            <h3 id="spellingPromptZh" class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">一年一度的</h3>
            <button onclick="speakSpellingWord()" class="mt-1 px-3 py-1.5 bg-white border border-slate-200 rounded-full text-xs font-semibold text-slate-600 hover:text-brand-600 transition flex items-center shadow-xs">
              <i class="fa-solid fa-volume-high mr-1.5 text-brand-500"></i>聽發音提示
            </button>
          </div>

          <!-- Input Box & Actions -->
          <div class="space-y-3">
            <div class="relative">
              <input type="text" id="spellingInput" autocomplete="off" placeholder="輸入英文單字..." onkeydown="if(event.key==='Enter') checkSpellingAnswer()"
                class="w-full text-center text-xl font-bold py-3.5 px-4 rounded-xl border-2 border-slate-200 focus:border-brand-500 focus:outline-none transition tracking-wide text-slate-800">
            </div>

            <div id="spellingFeedback" class="text-center text-sm font-bold min-h-[24px]"></div>

            <div class="flex space-x-3">
              <button onclick="giveSpellingHint()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition text-sm flex items-center justify-center">
                <i class="fa-solid fa-lightbulb text-amber-500 mr-2"></i>提示字母
              </button>
              <button onclick="checkSpellingAnswer()" class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md shadow-brand-500/20 transition text-sm flex items-center justify-center">
                確認送出 <i class="fa-solid fa-check ml-2"></i>
              </button>
            </div>
          </div>

          <!-- Next Spelling Button -->
          <button id="spellingNextBtn" onclick="nextSpellingQuestion()" class="hidden w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold transition">
            下一題 <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
          </button>
        </div>

      </div>
    </section>

    <!-- TAB 4: WORD LIST BROWSER -->
    <section id="view-browser" class="view-panel hidden flex-1 flex flex-col space-y-4">
      
      <!-- Search Input Bar -->
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="browserSearchInput" oninput="renderWordBrowser()" placeholder="搜尋英文單字或中文解釋..."
          class="w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm font-medium focus:ring-2 focus:ring-brand-500 focus:outline-none shadow-xs">
      </div>

      <!-- Word Table Container -->
      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden flex-1">
        <div class="overflow-x-auto max-h-[500px]">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 border-b border-slate-200 text-slate-400 font-bold text-xs uppercase tracking-wider sticky top-0 z-10">
              <tr>
                <th class="px-4 py-3 w-12 text-center">標記</th>
                <th class="px-4 py-3">英文單字</th>
                <th class="px-4 py-3">中文翻譯</th>
                <th class="px-4 py-3">來源與課別</th>
                <th class="px-4 py-3 text-right">發音</th>
              </tr>
            </thead>
            <tbody id="browserTableBody" class="divide-y divide-slate-100 font-medium">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <script>
    const rawVocabData = [
      // 單字書
      { cat: "單字書", unit: "U17", en: "annual", zh: "一年一度的" },
      { cat: "單字書", unit: "U17", en: "turn out", zh: "出席" },
      { cat: "單字書", unit: "U17", en: "admire", zh: "欣賞" },
      { cat: "單字書", unit: "U17", en: "wrap", zh: "用…包裹" },
      { cat: "單字書", unit: "U17", en: "in advance", zh: "事先" },
      { cat: "單字書", unit: "U17", en: "expert", zh: "專門的" },
      { cat: "單字書", unit: "U17", en: "instrument", zh: "樂器" },
      { cat: "單字書", unit: "U17", en: "decoration", zh: "裝飾品" },
      { cat: "單字書", unit: "U17", en: "crisp", zh: "清新的" },
      { cat: "單字書", unit: "U17", en: "beam", zh: "光線" },
      { cat: "單字書", unit: "U17", en: "entire", zh: "整個的" },
      { cat: "單字書", unit: "U17", en: "explore", zh: "探討" },
      { cat: "單字書", unit: "U17", en: "organize", zh: "籌畫" },

    // Pronunciation function (STRICTLY triggers ONLY on manual button click)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop active speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function onCategoryChange() {
      const cat = document.getElementById('filterCategory').value;
      const unitSelect = document.getElementById('filterUnit');
      
      unitSelect.innerHTML = '<option value="ALL">全部單元</option>';
      
      const availableUnits = [...new Set(
        vocabList
          .filter(item => cat === 'ALL' || item.cat === cat)
          .map(item => item.unit)
      )];

      availableUnits.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u;
        opt.textContent = u;
        unitSelect.appendChild(opt);
      });

      onFilterChange();
    }

    function onFilterChange() {
      const cat = document.getElementById('filterCategory').value;
      const unit = document.getElementById('filterUnit').value;
      const starredOnly = document.getElementById('filterStarred').checked;

      filteredList = vocabList.filter(item => {
        const matchCat = (cat === 'ALL' || item.cat === cat);
        const matchUnit = (unit === 'ALL' || item.unit === unit);
        const matchStarred = (!starredOnly || starredSet.has(item.en));
        return matchCat && matchUnit && matchStarred;
      });

      document.getElementById('filteredWordCount').textContent = filteredList.length;
      document.getElementById('quizStartCount').textContent = filteredList.length;
      document.getElementById('spellingStartCount').textContent = filteredList.length;
      
      updateStarredCountDisplay();

      // Always reset quiz and spelling screens back to cover on filter change
      resetQuizToStart();
      resetSpellingToStart();

      currentCardIndex = 0;
      if (currentTab === 'cards') renderCurrentCard();
      if (currentTab === 'browser') renderWordBrowser();
    }

    function shuffleAndReset() {
      filteredList.sort(() => Math.random() - 0.5);
      onFilterChange();
    }

    function toggleStar(enWord) {
      if (starredSet.has(enWord)) {
        starredSet.delete(enWord);
      } else {
        starredSet.add(enWord);
      }
      localStorage.setItem('starredWords', JSON.stringify([...starredSet]));
      updateStarredCountDisplay();
      
      if (currentTab === 'cards') renderCurrentCard();
      if (currentTab === 'browser') renderWordBrowser();
    }

    function updateStarredCountDisplay() {
      document.getElementById('starredCount').textContent = starredSet.size;
    }

    function switchTab(tabKey) {
      currentTab = tabKey;

      // Desktop Nav Styling
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-brand-600', 'shadow-xs');
        btn.classList.add('text-slate-600');
      });
      const activeTab = document.getElementById(`tab-${tabKey}`);
      if (activeTab) {
        activeTab.classList.add('bg-white', 'text-brand-600', 'shadow-xs');
        activeTab.classList.remove('text-slate-600');
      }

      // Mobile Nav Styling
      document.querySelectorAll('.mob-tab-btn').forEach(btn => {
        btn.classList.remove('text-brand-600', 'font-bold');
        btn.classList.add('text-slate-500');
      });
      const activeMobTab = document.getElementById(`mob-tab-${tabKey}`);
      if (activeMobTab) {
        activeMobTab.classList.add('text-brand-600', 'font-bold');
        activeMobTab.classList.remove('text-slate-500');
      }

      // Hide all panels
      document.querySelectorAll('.view-panel').forEach(panel => panel.classList.add('hidden'));

      // Show current panel
      document.getElementById(`view-${tabKey}`).classList.remove('hidden');

      if (tabKey === 'cards') renderCurrentCard();
      if (tabKey === 'browser') renderWordBrowser();
    }

    function flipCard() {
      document.getElementById('flashcardInner').classList.toggle('flipped');
    }

    function renderCurrentCard() {
      if (filteredList.length === 0) {
        document.getElementById('cardWord').textContent = "無單字";
        document.getElementById('cardTranslation').textContent = "請調整篩選條件";
        document.getElementById('cardProgressText').textContent = "0 / 0";
        document.getElementById('cardProgressBar').style.width = '0%';
        return;
      }

      if (currentCardIndex >= filteredList.length) currentCardIndex = 0;
      if (currentCardIndex < 0) currentCardIndex = filteredList.length - 1;

      const item = filteredList[currentCardIndex];
      document.getElementById('flashcardInner').classList.remove('flipped');

      document.getElementById('cardWord').textContent = item.en;
      document.getElementById('cardWordSub').textContent = item.en;
      document.getElementById('cardTranslation').textContent = item.zh;
      
      const tagText = `${item.cat} • ${item.unit}`;
      document.getElementById('cardCategoryTag').textContent = tagText;
      document.getElementById('cardCategoryTagBack').textContent = tagText;

      const starBtn = document.getElementById('cardStarBtn');
      if (starredSet.has(item.en)) {
        starBtn.className = "p-2 text-amber-400 hover:text-amber-500 transition text-lg";
      } else {
        starBtn.className = "p-2 text-slate-300 hover:text-amber-400 transition text-lg";
      }

      const progress = ((currentCardIndex + 1) / filteredList.length) * 100;
      document.getElementById('cardProgressText').textContent = `第 ${currentCardIndex + 1} / ${filteredList.length} 字`;
      document.getElementById('cardProgressBar').style.width = `${progress}%`;
    }

    function nextCard() {
      if (filteredList.length === 0) return;
      currentCardIndex = (currentCardIndex + 1) % filteredList.length;
      renderCurrentCard();
    }

    function prevCard() {
      if (filteredList.length === 0) return;
      currentCardIndex = (currentCardIndex - 1 + filteredList.length) % filteredList.length;
      renderCurrentCard();
    }

    function toggleStarCurrent() {
      if (filteredList.length === 0) return;
      toggleStar(filteredList[currentCardIndex].en);
    }

    function speakCardWord() {
      if (filteredList.length === 0) return;
      speakText(filteredList[currentCardIndex].en);
    }

    function resetQuizToStart() {
      quizStarted = false;
      document.getElementById('quizStartCard').classList.remove('hidden');
      document.getElementById('quizMainContent').classList.add('hidden');
      document.getElementById('quizMainContent').classList.remove('flex');
    }

    function startQuiz() {
      if (filteredList.length === 0) return;
      quizStarted = true;
      document.getElementById('quizStartCard').classList.add('hidden');
      document.getElementById('quizMainContent').classList.remove('hidden');
      document.getElementById('quizMainContent').classList.add('flex');
      generateQuizQuestion();
    }

    function generateQuizQuestion() {
      if (!quizStarted || filteredList.length === 0) return;

      document.getElementById('quizNextBtn').classList.add('hidden');
      
      // Select target word randomly from filtered list
      currentQuizWord = filteredList[Math.floor(Math.random() * filteredList.length)];
      
      document.getElementById('quizQuestionWord').textContent = currentQuizWord.en;
      document.getElementById('quizTag').textContent = `${currentQuizWord.cat} • ${currentQuizWord.unit}`;

      // Pick 3 wrong options
      let wrongCandidates = vocabList.filter(item => item.zh !== currentQuizWord.zh);
      wrongCandidates.sort(() => 0.5 - Math.random());

      let wrongChoices = [];
      let usedZh = new Set([currentQuizWord.zh]);

      for (let item of wrongCandidates) {
        if (!usedZh.has(item.zh)) {
          usedZh.add(item.zh);
          wrongChoices.push(item);
          if (wrongChoices.length === 3) break;
        }
      }

      currentQuizChoices = [currentQuizWord, ...wrongChoices].sort(() => 0.5 - Math.random());

      const container = document.getElementById('quizChoices');
      container.innerHTML = '';

      currentQuizChoices.forEach((choiceObj, index) => {
        const btn = document.createElement('button');
        btn.className = "quiz-choice-btn w-full p-4 rounded-2xl bg-slate-50 hover:bg-indigo-50/80 border-2 border-slate-200/80 text-slate-700 font-bold text-left transition duration-150 flex items-center justify-between";
        btn.dataset.index = index;
        btn.innerHTML = `<span class="choice-text text-base">${choiceObj.zh}</span> <i class="fa-regular fa-circle text-slate-300 choice-icon text-lg"></i>`;
        btn.onclick = () => checkQuizAnswer(choiceObj, btn);
        container.appendChild(btn);
      });
    }

    function speakQuizWord() {
      if (currentQuizWord) speakText(currentQuizWord.en);
    }

    function checkQuizAnswer(selectedChoice, btn) {
      quizTotalCount++;
      const allBtns = document.querySelectorAll('.quiz-choice-btn');
      allBtns.forEach(b => b.disabled = true);

      // Reveal full English + Chinese translation for ALL options after answering!
      allBtns.forEach(b => {
        const idx = parseInt(b.dataset.index, 10);
        const choiceObj = currentQuizChoices[idx];
        const textSpan = b.querySelector('.choice-text');
        
        if (textSpan && choiceObj) {
          textSpan.innerHTML = `
            <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-3">
              <span class="inline-block px-2 py-0.5 rounded bg-slate-200/70 text-slate-800 font-mono font-bold text-xs uppercase w-fit">${choiceObj.en}</span>
              <span class="text-slate-800 font-semibold">${choiceObj.zh}</span>
            </div>
          `;
        }
      });

      if (selectedChoice.zh === currentQuizWord.zh) {
        quizCorrectCount++;
        quizStreakCount++;
        btn.className = "quiz-choice-btn w-full p-4 rounded-2xl bg-emerald-50 border-2 border-emerald-500 text-emerald-900 font-bold text-left flex items-center justify-between pulse-feedback shadow-sm";
        btn.querySelector('.choice-icon').className = "fa-solid fa-circle-check text-emerald-500 text-xl";
      } else {
        quizStreakCount = 0;
        btn.className = "quiz-choice-btn w-full p-4 rounded-2xl bg-rose-50 border-2 border-rose-500 text-rose-900 font-bold text-left flex items-center justify-between shadow-sm";
        btn.querySelector('.choice-icon').className = "fa-solid fa-circle-xmark text-rose-500 text-xl";

        // Highlight correct option
        allBtns.forEach(b => {
          const idx = parseInt(b.dataset.index, 10);
          if (currentQuizChoices[idx] && currentQuizChoices[idx].zh === currentQuizWord.zh) {
            b.className = "quiz-choice-btn w-full p-4 rounded-2xl bg-emerald-50 border-2 border-emerald-500 text-emerald-900 font-bold text-left flex items-center justify-between shadow-sm";
            b.querySelector('.choice-icon').className = "fa-solid fa-circle-check text-emerald-500 text-xl";
          }
        });
      }

      document.getElementById('quizCorrect').textContent = quizCorrectCount;
      document.getElementById('quizTotal').textContent = quizTotalCount;
      document.getElementById('quizStreak').textContent = `🔥 ${quizStreakCount}`;

      document.getElementById('quizNextBtn').classList.remove('hidden');
    }

    function resetSpellingToStart() {
      spellingStarted = false;
      document.getElementById('spellingStartCard').classList.remove('hidden');
      document.getElementById('spellingMainContent').classList.add('hidden');
      document.getElementById('spellingMainContent').classList.remove('flex');
    }

    function startSpelling() {
      if (filteredList.length === 0) return;
      spellingStarted = true;
      document.getElementById('spellingStartCard').classList.add('hidden');
      document.getElementById('spellingMainContent').classList.remove('hidden');
      document.getElementById('spellingMainContent').classList.add('flex');
      setupNextSpellingQuestion();
    }

    function setupNextSpellingQuestion() {
      if (!spellingStarted || filteredList.length === 0) return;

      currentSpellingWord = filteredList[Math.floor(Math.random() * filteredList.length)];
      spellingHintIndex = 0;

      document.getElementById('spellingPromptZh').textContent = currentSpellingWord.zh;
      document.getElementById('spellingTag').textContent = `${currentSpellingWord.cat} • ${currentSpellingWord.unit}`;
      
      const input = document.getElementById('spellingInput');
      input.value = '';
      input.disabled = false;
      input.className = "w-full text-center text-xl font-bold py-3.5 px-4 rounded-xl border-2 border-slate-200 focus:border-brand-500 focus:outline-none transition tracking-wide text-slate-800";

      document.getElementById('spellingFeedback').textContent = '';
      document.getElementById('spellingNextBtn').classList.add('hidden');
    }

    function nextSpellingQuestion() {
      setupNextSpellingQuestion();
    }

    function speakSpellingWord() {
      if (currentSpellingWord) speakText(currentSpellingWord.en);
    }

    function giveSpellingHint() {
      if (!currentSpellingWord) return;
      const input = document.getElementById('spellingInput');
      spellingHintIndex++;
      
      const hintStr = currentSpellingWord.en.substring(0, spellingHintIndex);
      input.value = hintStr;
      input.focus();
    }

    function checkSpellingAnswer() {
      if (!currentSpellingWord) return;

      const input = document.getElementById('spellingInput');
      const feedback = document.getElementById('spellingFeedback');
      const userVal = input.value.trim().toLowerCase();
      const targetVal = currentSpellingWord.en.trim().toLowerCase();

      if (userVal === targetVal) {
        spellingScoreCount += 10;
        document.getElementById('spellingScore').textContent = `得分: ${spellingScoreCount}`;
        
        feedback.textContent = "🎉 恭喜！拼寫完全正確！";
        feedback.className = "text-center text-sm font-bold text-emerald-600 min-h-[24px]";
        input.className = "w-full text-center text-xl font-bold py-3.5 px-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-800 focus:outline-none transition tracking-wide";
        input.disabled = true;

        document.getElementById('spellingNextBtn').classList.remove('hidden');
      } else {
        feedback.textContent = `❌ 拼寫不符！正確答案是：${currentSpellingWord.en}`;
        feedback.className = "text-center text-sm font-bold text-rose-600 min-h-[24px]";
        input.className = "w-full text-center text-xl font-bold py-3.5 px-4 rounded-xl border-2 border-rose-400 bg-rose-50 text-rose-800 focus:outline-none transition tracking-wide";
      }
    }

    function renderWordBrowser() {
      const tbody = document.getElementById('browserTableBody');
      const query = (document.getElementById('browserSearchInput').value || '').toLowerCase().trim();

      tbody.innerHTML = '';

      const itemsToDisplay = filteredList.filter(item => {
        return item.en.toLowerCase().includes(query) || item.zh.includes(query);
      });

      if (itemsToDisplay.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400 font-medium">查無相關單字</td></tr>`;
        return;
      }

      itemsToDisplay.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50/80 transition border-b border-slate-100";

        const isStarred = starredSet.has(item.en);
        const starIconClass = isStarred ? "fa-solid fa-star text-amber-400" : "fa-regular fa-star text-slate-300 hover:text-amber-400";

        tr.innerHTML = `
          <td class="px-4 py-3 text-center">
            <button onclick="toggleStar('${item.en}')" class="p-1 transition">
              <i class="${starIconClass}"></i>
            </button>
          </td>
          <td class="px-4 py-3 font-bold text-slate-800">${item.en}</td>
          <td class="px-4 py-3 text-slate-600">${item.zh}</td>
          <td class="px-4 py-3 text-xs">
            <span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-md font-semibold">${item.cat} • ${item.unit}</span>
          </td>
          <td class="px-4 py-3 text-right">
            <button onclick="speakText('${item.en}')" title="播放發音" class="w-8 h-8 rounded-full hover:bg-slate-100 text-slate-400 hover:text-brand-600 transition inline-flex items-center justify-center">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    window.onload = function() {
      onCategoryChange();
    };
  </script>
</body>
</html>
